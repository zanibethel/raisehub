name: Temporary lockfile refresh

on:
  push:
    branches:
      - security/automated-scanning

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/automated-scanning

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile from pinned manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply compatible production vulnerability fixes
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts || true

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "RaiseHub Security Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh secure dependency lockfile [lock refresh]"
          git push origin HEAD:security/automated-scanning
