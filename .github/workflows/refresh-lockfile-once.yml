name: Refresh security lockfile once

on:
  push:
    branches:
      - sprint/launch-hardening-2026-09-16
    paths:
      - .github/workflows/refresh-lockfile-once.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sprint/launch-hardening-2026-09-16

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh Next.js and transitive security fixes
        run: |
          npm install --save-exact next@16.3.5 eslint-config-next@16.3.5
          npm update sharp --package-lock-only

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch production dependency vulnerabilities"
          git push origin HEAD:sprint/launch-hardening-2026-09-16
