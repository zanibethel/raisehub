name: RaiseHub Code Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: raisehub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-mobile-qr-print:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/campaign-seller-invitations'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/campaign-seller-invitations

      - name: Patch QR print portal and CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/dashboards/organization/organization-seller-roster-preview.tsx')
          text = path.read_text()

          if "import { createPortal } from 'react-dom'" not in text:
              text = text.replace(
                  "import { ChangeEvent, useEffect, useMemo, useState, useTransition } from 'react'",
                  "import { ChangeEvent, useEffect, useMemo, useState, useTransition } from 'react'\nimport { createPortal } from 'react-dom'",
              )

          old_style = """      <style>{`@media print { body * { visibility: hidden !important; } #raisehub-qr-print-sheet, #raisehub-qr-print-sheet * { visibility: visible !important; } #raisehub-qr-print-sheet { position: absolute !important; inset: 0 !important; width: 100% !important; background: white !important; padding: 0 !important; } .raisehub-print-actions { display: none !important; } }`}</style>"""
          new_style = """      <style>{`
        @media print {
          @page { size: letter portrait; margin: 0.35in; }
          html, body { margin: 0 !important; padding: 0 !important; background: white !important; }
          body > *:not(#raisehub-qr-print-root) { display: none !important; }
          #raisehub-qr-print-root { display: block !important; position: static !important; background: white !important; padding: 0 !important; }
          #raisehub-qr-print-sheet { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
          .raisehub-print-actions { display: none !important; }
          #raisehub-qr-print-sheet main { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 0.15in !important; }
          #raisehub-qr-print-sheet article { break-inside: avoid !important; page-break-inside: avoid !important; padding: 0.1in !important; }
          #raisehub-qr-print-sheet img { width: 1.35in !important; height: 1.35in !important; }
          #raisehub-qr-print-sheet header { margin-bottom: 0.15in !important; }
          #raisehub-qr-print-sheet footer { margin-top: 0.15in !important; }
        }
      `}</style>"""
          if old_style in text:
              text = text.replace(old_style, new_style)

          old_open = """      {qrSheet ? (
        <div className=\"fixed inset-0 z-[100] overflow-y-auto bg-slate-950/70 p-3 sm:p-6\">"""
          new_open = """      {qrSheet && typeof document !== 'undefined' ? createPortal(
        <div id=\"raisehub-qr-print-root\" className=\"fixed inset-0 z-[100] overflow-y-auto bg-slate-950/70 p-3 sm:p-6\">"""
          if old_open in text:
              text = text.replace(old_open, new_open)

          old_close = """        </div>
      ) : null}
    </>
"""
          new_close = """        </div>,
        document.body
      ) : null}
    </>
"""
          if old_close in text:
              text = text.replace(old_close, new_close)

          path.write_text(text)
          PY

      - name: Commit print fix
        run: |
          if git diff --quiet -- src/components/dashboards/organization/organization-seller-roster-preview.tsx; then
            echo "QR print fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboards/organization/organization-seller-roster-preview.tsx
          git commit -m "Fix mobile QR sheet PDF pagination"
          git push origin HEAD:feat/campaign-seller-invitations

  verify:
    name: Test, Lint, TypeScript, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run tests
        id: test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Run lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Check TypeScript
        id: typecheck
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee typecheck.log

      - name: Build application
        id: build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Create CI report
        if: always()
        run: |
          {
            echo "RaiseHub CI Report"
            echo "=================="
            echo ""
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Triggered by: $GITHUB_ACTOR"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo ""
            echo "Install result: ${{ steps.install.outcome }}"
            echo "Test result: ${{ steps.test.outcome }}"
            echo "Lint result: ${{ steps.lint.outcome }}"
            echo "TypeScript result: ${{ steps.typecheck.outcome }}"
            echo "Build result: ${{ steps.build.outcome }}"
          } > ci-report.txt

      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raisehub-ci-report-${{ github.run_id }}
          path: |
            ci-report.txt
            test.log
            lint.log
            typecheck.log
            build.log
          retention-days: 30
          if-no-files-found: warn
