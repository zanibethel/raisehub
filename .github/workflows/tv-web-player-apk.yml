name: Build WebPortal APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/tv-web-player/**'
      - '.github/workflows/tv-web-player-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/tv-web-player/**'
      - '.github/workflows/tv-web-player-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: tools/tv-web-player
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp tools/tv-web-player/app/build/outputs/apk/debug/app-debug.apk WebPortal.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebPortal-apk
          path: WebPortal.apk
          if-no-files-found: error

      - name: Publish stable download asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view webportal >/dev/null 2>&1; then
            gh release upload webportal WebPortal.apk --clobber
          else
            gh release create webportal WebPortal.apk               --target "$GITHUB_SHA"               --title "WebPortal"               --notes "Fire TV web browser/player. Use https://raisehub.app/webportal for the permanent download address."
          fi
