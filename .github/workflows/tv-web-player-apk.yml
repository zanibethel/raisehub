name: Build WebPortal APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/tv-web-player/**'
      - '.github/workflows/tv-web-player-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/tv-web-player/**'
      - '.github/workflows/tv-web-player-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify signing secrets
        env:
          WEBPORTAL_KEYSTORE_BASE64: ${{ secrets.WEBPORTAL_KEYSTORE_BASE64 }}
          WEBPORTAL_KEYSTORE_PASSWORD: ${{ secrets.WEBPORTAL_KEYSTORE_PASSWORD }}
          WEBPORTAL_KEY_ALIAS: ${{ secrets.WEBPORTAL_KEY_ALIAS }}
          WEBPORTAL_KEY_PASSWORD: ${{ secrets.WEBPORTAL_KEY_PASSWORD }}
        run: |
          test -n "$WEBPORTAL_KEYSTORE_BASE64"
          test -n "$WEBPORTAL_KEYSTORE_PASSWORD"
          test -n "$WEBPORTAL_KEY_ALIAS"
          test -n "$WEBPORTAL_KEY_PASSWORD"

      - name: Restore permanent signing key
        env:
          WEBPORTAL_KEYSTORE_BASE64: ${{ secrets.WEBPORTAL_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$WEBPORTAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/webportal-release.jks"
          test -s "$RUNNER_TEMP/webportal-release.jks"

      - name: Build permanently signed release APK
        working-directory: tools/tv-web-player
        env:
          WEBPORTAL_KEYSTORE_PATH: ${{ runner.temp }}/webportal-release.jks
          WEBPORTAL_KEYSTORE_PASSWORD: ${{ secrets.WEBPORTAL_KEYSTORE_PASSWORD }}
          WEBPORTAL_KEY_ALIAS: ${{ secrets.WEBPORTAL_KEY_ALIAS }}
          WEBPORTAL_KEY_PASSWORD: ${{ secrets.WEBPORTAL_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: cp tools/tv-web-player/app/build/outputs/apk/release/app-release.apk WebPortal.apk

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs WebPortal.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebPortal-apk
          path: WebPortal.apk
          if-no-files-found: error

      - name: Publish stable download asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view webportal >/dev/null 2>&1; then
            gh release upload webportal WebPortal.apk --clobber
          else
            gh release create webportal WebPortal.apk               --target "$GITHUB_SHA"               --title "WebPortal"               --notes "Fire TV web browser/player. Use https://raisehub.app/webportal for the permanent download address."
          fi
