name: Build WebPortal Cast APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/webportal-cast/**'
      - '.github/workflows/webportal-cast-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/webportal-cast/**'
      - '.github/workflows/webportal-cast-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build PR test APK (no production signing secrets)
        if: github.event_name == 'pull_request'
        working-directory: tools/webportal-cast
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify release signing credentials
        if: github.event_name != 'pull_request'
        env:
          WEBPORTAL_KEYSTORE_BASE64: ${{ secrets.WEBPORTAL_KEYSTORE_BASE64 }}
          WEBPORTAL_KEYSTORE_PASSWORD: ${{ secrets.WEBPORTAL_KEYSTORE_PASSWORD }}
          WEBPORTAL_KEY_ALIAS: ${{ secrets.WEBPORTAL_KEY_ALIAS }}
          WEBPORTAL_KEY_PASSWORD: ${{ secrets.WEBPORTAL_KEY_PASSWORD }}
        run: |
          test -n "$WEBPORTAL_KEYSTORE_BASE64"
          test -n "$WEBPORTAL_KEYSTORE_PASSWORD"
          test -n "$WEBPORTAL_KEY_ALIAS"
          test -n "$WEBPORTAL_KEY_PASSWORD"

      - name: Restore persistent release signing key
        if: github.event_name != 'pull_request'
        env:
          WEBPORTAL_KEYSTORE_BASE64: ${{ secrets.WEBPORTAL_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$WEBPORTAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/webportal-cast-release.jks"
          test -s "$RUNNER_TEMP/webportal-cast-release.jks"

      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        working-directory: tools/webportal-cast
        env:
          WEBPORTAL_KEYSTORE_PATH: ${{ runner.temp }}/webportal-cast-release.jks
          WEBPORTAL_KEYSTORE_PASSWORD: ${{ secrets.WEBPORTAL_KEYSTORE_PASSWORD }}
          WEBPORTAL_KEY_ALIAS: ${{ secrets.WEBPORTAL_KEY_ALIAS }}
          WEBPORTAL_KEY_PASSWORD: ${{ secrets.WEBPORTAL_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cp tools/webportal-cast/app/build/outputs/apk/debug/app-debug.apk WebPortalCast.apk
          else
            cp tools/webportal-cast/app/build/outputs/apk/release/app-release.apk WebPortalCast.apk
          fi

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs WebPortalCast.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WebPortalCast-apk
          path: WebPortalCast.apk
          if-no-files-found: error

      - name: Publish permanent release download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view webportal-cast >/dev/null 2>&1; then
            gh release upload webportal-cast WebPortalCast.apk --clobber
          else
            gh release create webportal-cast WebPortalCast.apk \
              --target "$GITHUB_SHA" \
              --title "WebPortal Cast" \
              --notes "Standalone Fire TV DLNA media receiver. Quest, Google Cast, AirPlay and Miracast are not yet supported. Install via https://raisehub.app/cast"
          fi
