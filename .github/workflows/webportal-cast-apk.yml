name: Build WebPortal Cast APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/webportal-cast/**'
      - '.github/workflows/webportal-cast-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/webportal-cast/**'
      - '.github/workflows/webportal-cast-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build PR test APK (no production signing secrets)
        if: github.event_name == 'pull_request'
        working-directory: tools/webportal-cast
        run: gradle :protocol:test :app:testDebugUnitTest :app:assembleDebug :quest:assembleDebug --stacktrace

      - name: Verify release signing credentials
        if: github.event_name != 'pull_request'
        env:
          WEBPORTAL_KEYSTORE_BASE64: ${{ secrets.WEBPORTAL_KEYSTORE_BASE64 }}
          WEBPORTAL_KEYSTORE_PASSWORD: ${{ secrets.WEBPORTAL_KEYSTORE_PASSWORD }}
          WEBPORTAL_KEY_ALIAS: ${{ secrets.WEBPORTAL_KEY_ALIAS }}
          WEBPORTAL_KEY_PASSWORD: ${{ secrets.WEBPORTAL_KEY_PASSWORD }}
        run: |
          test -n "$WEBPORTAL_KEYSTORE_BASE64"
          test -n "$WEBPORTAL_KEYSTORE_PASSWORD"
          test -n "$WEBPORTAL_KEY_ALIAS"
          test -n "$WEBPORTAL_KEY_PASSWORD"

      - name: Restore persistent release signing key
        if: github.event_name != 'pull_request'
        env:
          WEBPORTAL_KEYSTORE_BASE64: ${{ secrets.WEBPORTAL_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$WEBPORTAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/webportal-cast-release.jks"
          test -s "$RUNNER_TEMP/webportal-cast-release.jks"

      - name: Confirm release version increases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' tools/webportal-cast/app/build.gradle | head -n 1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" tools/webportal-cast/app/build.gradle | head -n 1)"
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          if gh release view webportal-cast >/dev/null 2>&1; then
            PREVIOUS_CODE="$(gh release view webportal-cast --json body --jq '.body' | sed -nE 's/^Version-Code: ([0-9]+)$/\1/p' | head -n 1)"
            if [ -n "$PREVIOUS_CODE" ] && [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
              echo "::error::Refusing non-increasing versionCode: current release=$PREVIOUS_CODE new=$VERSION_CODE"
              exit 1
            fi
          fi
          echo "CAST_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "CAST_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        working-directory: tools/webportal-cast
        env:
          WEBPORTAL_KEYSTORE_PATH: ${{ runner.temp }}/webportal-cast-release.jks
          WEBPORTAL_KEYSTORE_PASSWORD: ${{ secrets.WEBPORTAL_KEYSTORE_PASSWORD }}
          WEBPORTAL_KEY_ALIAS: ${{ secrets.WEBPORTAL_KEY_ALIAS }}
          WEBPORTAL_KEY_PASSWORD: ${{ secrets.WEBPORTAL_KEY_PASSWORD }}
        run: gradle :protocol:test :app:testDebugUnitTest :app:assembleRelease :quest:assembleRelease --stacktrace

      - name: Stage APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cp tools/webportal-cast/app/build/outputs/apk/debug/app-debug.apk WebPortalCast.apk
            cp tools/webportal-cast/quest/build/outputs/apk/debug/quest-debug.apk WebPortalQuestCast.apk
          else
            cp tools/webportal-cast/app/build/outputs/apk/release/app-release.apk WebPortalCast.apk
            cp tools/webportal-cast/quest/build/outputs/apk/release/quest-release.apk WebPortalQuestCast.apk
          fi

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs WebPortalCast.apk
          "$APKSIGNER" verify --verbose --print-certs WebPortalQuestCast.apk

      - name: Verify existing users can update in place
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view webportal-cast >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/cast-previous"
            gh release download webportal-cast --pattern WebPortalCast.apk --dir "$RUNNER_TEMP/cast-previous"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
            OLD_CERT="$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/cast-previous/WebPortalCast.apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')"
            NEW_CERT="$("$APKSIGNER" verify --print-certs WebPortalCast.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')"
            test -n "$OLD_CERT" && test -n "$NEW_CERT"
            if [ "$OLD_CERT" != "$NEW_CERT" ]; then
              echo "::error::Signing certificate changed; existing Fire TV installations cannot update!"
              exit 1
            fi
            echo "Verified original published signer matches new signed APK"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: WebPortalCast-and-Quest-apks
          path: |
            WebPortalCast.apk
            WebPortalQuestCast.apk
          if-no-files-found: error

      - name: Publish permanent release download and verified update metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA256="$(sha256sum WebPortalCast.apk | awk '{print $1}')"
          QUEST_SHA256="$(sha256sum WebPortalQuestCast.apk | awk '{print $1}')"
          printf '%s\n' \
            'WebPortal Cast Fire TV receiver + optional WebPortal Quest Cast sideload companion.' \
            'Quest Direct Cast preview supports 720p/30fps encrypted local video with TV PIN pairing and permission-based screen capture; NO AUDIO yet.' \
            'ChromeCast built-in Quest casting, Google Cast, AirPlay and Miracast are not yet supported.' \
            'Fire TV: https://raisehub.app/cast' \
            'Quest APK: https://github.com/zanibethel/raisehub/releases/download/webportal-cast/WebPortalQuestCast.apk' \
            'After installing the Quest companion APK, open Quest Direct Cast on TV and type its IPv4 address/pair code in the Quest app.' \
            'Later TV updates: choose Check for updates in the app.' \
            '' \
            "Version-Code: $CAST_VERSION_CODE" \
            "Version-Name: $CAST_VERSION_NAME" \
            "SHA256: $SHA256" \
            "Quest-SHA256: $QUEST_SHA256" > "$RUNNER_TEMP/webportal-cast-release-notes.txt"
          if gh release view webportal-cast >/dev/null 2>&1; then
            gh release upload webportal-cast WebPortalCast.apk WebPortalQuestCast.apk --clobber
            gh release edit webportal-cast \
              --target "$GITHUB_SHA" \
              --title "WebPortal Cast v$CAST_VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/webportal-cast-release-notes.txt"
          else
            gh release create webportal-cast WebPortalCast.apk WebPortalQuestCast.apk \
              --target "$GITHUB_SHA" \
              --title "WebPortal Cast v$CAST_VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/webportal-cast-release-notes.txt"
          fi
