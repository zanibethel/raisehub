name: Add server-only dependency

on:
  push:
    branches:
      - feat/campaign-seller-invitations
    paths:
      - .github/workflows/add-server-only-dependency.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/campaign-seller-invitations
          fetch-depth: 0

      - name: Add server-only package and sync lockfile
        run: npm install --save-dev server-only@0.0.1 --ignore-scripts --no-audit --no-fund

      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add server-only dependency for repository tests"
          git push origin HEAD:feat/campaign-seller-invitations
