plugins { id 'com.android.application' }

def castKeystorePath = System.getenv('WEBPORTAL_KEYSTORE_PATH')
def castStorePassword = System.getenv('WEBPORTAL_KEYSTORE_PASSWORD')
def castKeyAlias = System.getenv('WEBPORTAL_KEY_ALIAS')
def castKeyPassword = System.getenv('WEBPORTAL_KEY_PASSWORD')
def haveSigning = castKeystorePath && castStorePassword && castKeyAlias && castKeyPassword

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.zac.webportalcast'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zac.webportalcast'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '0.2.0'
    }

    signingConfigs {
        persistentRelease {
            if (haveSigning) {
                storeFile file(castKeystorePath)
                storePassword castStorePassword
                keyAlias castKeyAlias
                keyPassword castKeyPassword
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (haveSigning) signingConfig signingConfigs.persistentRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':protocol')
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
}
