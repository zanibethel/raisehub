plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zac.tvwebplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zac.webportal'
        minSdk 21
        targetSdk 35
        versionCode 7
        versionName '1.6.0'
    }

    signingConfigs {
        release {
            def signingPath = System.getenv('WEBPORTAL_KEYSTORE_PATH')
            def signingStorePassword = System.getenv('WEBPORTAL_KEYSTORE_PASSWORD')
            def signingAlias = System.getenv('WEBPORTAL_KEY_ALIAS')
            def signingKeyPassword = System.getenv('WEBPORTAL_KEY_PASSWORD')

            if (!signingPath || !signingStorePassword || !signingAlias || !signingKeyPassword) {
                throw new GradleException('WebPortal release signing credentials are not configured.')
            }

            storeFile file(signingPath)
            storePassword signingStorePassword
            keyAlias signingAlias
            keyPassword signingKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.1'
    implementation 'androidx.media3:media3-ui:1.8.1'
}
